<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q.C Software - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #0f172a;
            background-image: linear-gradient(rgba(15, 23, 42, 0.72), rgba(15, 23, 42, 0.72)),
                              url('background_login.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #1e293b;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 40px 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.55);
            text-align: center;
        }
        .login-logo {
            width: 95px;
            height: auto;
            margin: 0 auto 16px auto;
            display: block;
            /* Transforma o texto branco da logo em escuro sobre o fundo branco mantendo o tom ciano */
            filter: invert(1) hue-rotate(180deg);
        }
        .login-card h1 {
            margin: 0 0 6px 0;
            font-size: 24px;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .login-card h1 i { color: #0284c7; }
        .login-card p {
            margin: 0 0 26px 0;
            font-size: 13px;
            color: #64748b;
        }
        .input-group {
            text-align: left;
            margin-bottom: 18px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #334155;
            margin-bottom: 6px;
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }
        .input-wrapper input {
            width: 100%;
            padding: 12px 12px 12px 38px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            color: #0f172a;
            font-size: 15px;
            font-family: 'Roboto', sans-serif;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-wrapper input::placeholder {
            color: #94a3b8;
        }
        .input-wrapper input:focus {
            background: #ffffff;
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }
        .btn-login {
            width: 100%;
            padding: 13px;
            background: #0284c7;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Roboto', sans-serif;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }
        .btn-login:hover { background: #0369a1; }
        .btn-login:disabled { background: #94a3b8; cursor: not-allowed; box-shadow: none; }
        .erro-msg {
            display: none;
            background: #fef2f2;
            border: 1px solid #ef4444;
            color: #b91c1c;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="logoqc.png" alt="Q.C Software" class="login-logo">
        <h1><i class="fa-solid fa-industry"></i> Q.C Software</h1>
        <p>Identifique-se para acessar o Mapa das Máquinas</p>

        <div id="mensagem-erro" class="erro-msg"></div>

        <form id="form-login">
            <div class="input-group">
                <label for="username">Usuário</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="username" placeholder="Digite seu usuário" required autocomplete="username">
                </div>
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="senha" placeholder="Digite sua senha" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" id="btn-entrar" class="btn-login">
                <i class="fa-solid fa-right-to-bracket"></i> Entrar no Painel
            </button>
        </form>
    </div>

    <script>
        if (sessionStorage.getItem('qc_token')) {
            window.location.href = 'index.html';
        }

        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const senha = document.getElementById('senha').value;
            const btn = document.getElementById('btn-entrar');
            const erroBox = document.getElementById('mensagem-erro');

            erroBox.style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verificando...';

            try {
                const resposta = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, senha })
                });

                const dados = await resposta.json();

                if (!resposta.ok) {
                    throw new Error(dados.detail || 'Falha na autenticação');
                }

                sessionStorage.setItem('qc_token', dados.token);
                sessionStorage.setItem('qc_usuario', dados.usuario);
                window.location.href = 'index.html';

            } catch (erro) {
                erroBox.textContent = erro.message;
                erroBox.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Entrar no Painel';
            }
        });
    </script>
</body>
</html>
